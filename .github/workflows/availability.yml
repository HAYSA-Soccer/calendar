name: Build Availability JSON

permissions:
  contents: write

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      WEBAPP_URL: "https://script.google.com/macros/s/AKfycbz3dMJtYEYxPmoZmuacrM5dBGZ9Jbh5rW3OFtOQDXYyt2RRW41z41HQ4mui5EVzKJyQ/exec"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Fetch season window
        id: season
        run: |
          echo "🔎 Fetching season window..."
          RAW=$(curl -sSL "$WEBAPP_URL?mode=season_window")

          echo "Season window raw: $RAW"

          START_RAW=$(echo "$RAW" | jq -r '.season_start')
          END_RAW=$(echo "$RAW" | jq -r '.season_end')

          # Normalize to YYYY-MM-DD
          START=$(date -d "$START_RAW" +%Y-%m-%d)
          END=$(date -d "$END_RAW" +%Y-%m-%d)

          echo "📅 Season start: $START"
          echo "📅 Season end:   $END"

          echo "season_start=$START" >> $GITHUB_OUTPUT
          echo "season_end=$END" >> $GITHUB_OUTPUT

      - name: Build availability + search index
        run: |
          START="${{ steps.season.outputs.season_start }}"
          END="${{ steps.season.outputs.season_end }}"

          mkdir -p data/tmp_days data/tmp_search

          echo "🔎 Fetching fields..."
          FIELDS=$(curl -sSL "$WEBAPP_URL?mode=fields")

          echo "Fields: $FIELDS"

          CURRENT="$START"

          echo "🚀 Starting day-by-day build..."

          while [ "$CURRENT" != "$(date -d "$END + 1 day" +%Y-%m-%d)" ]; do
            echo "📅 Processing date: $CURRENT"

            DAY=$(curl -sSL "$WEBAPP_URL?mode=day_calendar&date=$CURRENT")

            echo "$DAY" > "data/tmp_days/${CURRENT}.json"

            COMPLEXES=$(echo "$DAY" | jq -r '.complex_timeline | keys[]')

            SEARCH="{}"
            for CX in $COMPLEXES; do
              WINDOWS=$(echo "$DAY" | jq --arg cx "$CX" '.complex_timeline[$cx]')
              SEARCH=$(echo "$SEARCH" | jq --arg cx "$CX" --argjson w "$WINDOWS" '.[$cx] = $w')
            done

            echo "$SEARCH" > "data/tmp_search/${CURRENT}.json"

            # ⭐ Normalize CURRENT before increment
            CURRENT=$(date -d "$CURRENT" +%Y-%m-%d)

            # ⭐ Increment safely
            CURRENT=$(date -d "$CURRENT + 1 day" +%Y-%m-%d)
          done

          echo "📦 Building days.json..."
          DAYS_JSON=$(jq -s 'reduce .[] as $d ({}; .[$d.date] = $d)' data/tmp_days/*.json)

          echo "📦 Building weeks.json..."
          WEEKS_JSON=$(jq -s '
            reduce .[] as $d ({}; 
              .[(($d.date | strptime("%Y-%m-%d") | mktime | strftime("%Y"))
                + "-W" +
                ($d.date | strptime("%Y-%m-%d") | mktime | strftime("%U")))]
              |= (. // {}) | .[$d.date] = $d
            )
          ' data/tmp_days/*.json)

          echo "📦 Building months.json..."
          MONTHS_JSON=$(jq -s '
            reduce .[] as $d ({}; 
              .[($d.date | strptime("%Y-%m-%d") | mktime | strftime("%Y-%m"))]
              |= (. // {}) | .[$d.date] = $d
            )
          ' data/tmp_days/*.json)

          echo "📦 Building search_index.json..."
          SEARCH_JSON="{}"
          for f in data/tmp_search/*.json; do
            d=$(basename "$f" .json)
            s=$(cat "$f")
            SEARCH_JSON=$(echo "$SEARCH_JSON" | jq --arg d "$d" --argjson v "$s" '.[$d] = $v')
          done

          echo "🧩 Assembling final availability.json..."
          FINAL_JSON=$(jq -n \
            --arg start "$START" \
            --arg end "$END" \
            --argjson fields "$FIELDS" \
            --argjson days "$DAYS_JSON" \
            --argjson weeks "$WEEKS_JSON" \
            --argjson months "$MONTHS_JSON" \
            '{
              season_start: $start,
              season_end: $end,
              fields: $fields.fields,
              complexes: $fields.complexes,
              days: $days,
              weeks: $weeks,
              months: $months
            }'
          )

          echo "$FINAL_JSON"  > data/availability.json
          echo "$SEARCH_JSON" > data/search_index.json

      - name: Commit updated JSON
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/availability.json data/search_index.json
          git commit -m "Updated availability + search index" || echo "No changes"
          git push
