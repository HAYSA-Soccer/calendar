<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HAYSA Calendar</title>
  <link rel="stylesheet" href="calendar.css?v=4">
</head>
<body>

  <header class="app-header">
    <h1>HAYSA Calendar</h1>

    <nav class="nav">
      <button id="dayModeBtn">Day View</button>
      <button id="weekModeBtn">Week View</button>
      <button id="monthModeBtn">Month View</button>
      <button id="searchModeBtn">Search</button>
    </nav>
  </header>

  <main class="main-container">
    <div id="view-header" class="view-header">
      <div class="controls">
        <button id="prevPeriod" class="nav-btn">←</button>
        <span id="periodLabel" class="period-label"></span>
        <button id="nextPeriod" class="nav-btn">→</button>
      </div>
    </div>

    <div id="filter-bar" class="filter-bar"></div>

    <!-- Day timeline (vertical) -->
    <div id="dayTimeline" class="timeline-container"></div>

    <!-- Week timeline (horizontal, complexes side-by-side) -->
    <div id="weekTimeline" class="timeline-container"></div>
  </main>

  <script src="calendar.js?v=4"></script>

</body>
</html>
