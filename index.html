<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HAYSA Field Availability</title>
  <link rel="stylesheet" href="calendar.css">
</head>
<body>

  <!-- HEADER -->
  <header class="app-header">
    <h1>HAYSA Field Availability</h1>
  </header>

  <!-- DATA TIMESTAMP -->
  <div id="dataTimestamp"></div>

  <!-- PRIMARY NAVIGATION -->
  <nav class="nav">
    <button data-view="day">Day</button>
    <button data-view="week">Week</button>
    <button data-view="month">Month</button>
    <button data-view="search">Search</button>
  </nav>

  <!-- COMPLEX STATUS -->
  <div id="complex-status" class="complex-status"></div>

  <!-- COMPLEX FILTER BUTTONS -->
  <div id="complex-filters" class="complex-filter-bar"></div>

  <!-- MAIN CONTENT (Day/Week/Month/Search controls go here) -->
  <main id="view-container"></main>

  <!-- TIMELINE CONTAINERS (always BELOW the main content) -->
  <div id="dayTimeline"></div>
  <div id="weekTimeline"></div>
  <div id="monthTimeline"></div>
  <div id="searchTimeline"></div>

  <!-- SCRIPT -->
  <script src="calendar.js"></script>

</body>
</html>
