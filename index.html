<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HAYSA Calendar</title>
  <link rel="stylesheet" href="calendar.css?v=21">
</head>
<body>

  <header class="app-header">
    <div class="app-header-inner">
      <h1 class="app-title">HAYSA Calendar</h1>

      <nav class="nav"> 
        <button data-view="day">Day</button>
        <button data-view="week">Week</button>
        <button data-view="month">Month</button>
        <button data-view="search">Search</button>
      </nav>
    </div>
    <div id="lastUpdated" class="last-updated"></div>
  </header>

  <!-- MUST BE EMPTY -->
  <main id="view-container"></main>

  <!-- MODULAR JS FILES -->
  <script src="js/calendar-data.js?v=21"></script>
  <script src="js/calendar-utils.js?v=21"></script>
  <script src="js/calendar-builder.js?v=21"></script>
  <script src="js/calendar-renderer.js?v=21"></script>
  <script src="js/calendar-init.js?v=21"></script>

</body>
</html>
