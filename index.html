<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HAYSA Calendar</title>
  <link rel="stylesheet" href="calendar.css?v=3">
</head>
<body>

  <header class="app-header">
    <h1>HAYSA Calendar</h1>

    <nav class="nav">
      <button id="dayModeBtn">Day View</button>
      <button id="weekModeBtn">Week View</button>
      <button id="monthModeBtn">Month View</button>
      <button id="searchModeBtn">Search</button>
    </nav>
  </header>

  <main id="view-container"></main>

  <!-- Day timeline (vertical) -->
  <div id="dayTimeline" class="timeline-container"></div>

  <!-- Week timeline (horizontal, complexes side-by-side) -->
  <div id="weekTimeline" class="timeline-container"></div>

  <script src="calendar.js?v=3"></script>

</body>
</html>
